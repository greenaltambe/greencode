services:
  mongodb:
    image: mongo:7
    container_name: oj-mongodb-prod
    restart: always
    volumes:
      - mongodb_prod_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: online-judge
    networks:
      - oj-prod-network

  redis:
    image: redis:7-alpine
    container_name: oj-redis-prod
    restart: always
    networks:
      - oj-prod-network

  minio:
    image: minio/minio:latest
    container_name: oj-minio-prod
    restart: always
    volumes:
      - minio_prod_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - oj-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: oj-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/online-judge
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      STORAGE_BASE_PATH: /app/problems
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
    volumes:
      - backend_problems_prod:/app/problems
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    depends_on:
      - mongodb
      - redis
      - minio
    networks:
      - oj-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api
    container_name: oj-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - oj-prod-network

networks:
  oj-prod-network:
    driver: bridge

volumes:
  mongodb_prod_data:
  minio_prod_data:
  backend_problems_prod: